name: Publish Brad.log

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check, build, index search, and upload Pages artifact
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6
        with:
          node-version: '24.22.1'
          package-manager: pnpm@11.25.0
          build-cmd: pnpm run build
          cache: false
      - name: Preserve the exact public article manifest
        uses: actions/upload-artifact@v4
        with:
          name: engagement-manifest
          path: dist/engagement-pages.json
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  deploy-community-worker:
    needs: deploy
    if: ${{ vars.CLOUDFLARE_WORKER_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download the SAME article list published to Pages
        uses: actions/download-artifact@v4
        with:
          name: engagement-manifest
          path: backend/dist
      - name: Prepare bundled Worker and secure production configuration
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          cp backend/dist/engagement-pages.json backend/allowed-pages.json
          node backend/scripts/bundle.mjs
          node backend/scripts/prepare-production-config.mjs
      - name: Set up Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Deploy Worker without replacing existing runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --config backend/dist/wrangler.json

  verify-interactions:
    needs: [deploy, deploy-community-worker]
    if: ${{ always() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download exact article manifest from the same build
        uses: actions/download-artifact@v4
        with:
          name: engagement-manifest
          path: dist
      - name: Verify the published manifest and EVERY article's comments API
        run: node scripts/check-engagement-api.mjs
