name: Import reviewed anonymous community module
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: brad-log-community-source
  cancel-in-progress: false
jobs:
  import-source:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the existing repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Stage public source bundle 1
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/brad-log.bundle.b64" <<'BUNDLE'
          
          BUNDLE
      - name: Stage public source bundle 2
        shell: bash
        run: |
          cat >> "$RUNNER_TEMP/brad-log.bundle.b64" <<'BUNDLE'
          
          BUNDLE
      - name: Stage public source bundle 3
        shell: bash
        run: |
          cat >> "$RUNNER_TEMP/brad-log.bundle.b64" <<'BUNDLE'
          
          BUNDLE
      - name: Stage public source bundle 4
        shell: bash
        run: |
          cat >> "$RUNNER_TEMP/brad-log.bundle.b64" <<'BUNDLE'
          
          BUNDLE
      - name: Stage public source bundle 5
        shell: bash
        run: |
          cat >> "$RUNNER_TEMP/brad-log.bundle.b64" <<'BUNDLE'
          
          BUNDLE
      - name: Stage public source bundle 6
        shell: bash
        run: |
          cat >> "$RUNNER_TEMP/brad-log.bundle.b64" <<'BUNDLE'
          
          BUNDLE
      - name: Verify checksum and import public source
        shell: python
        run: |
          import base64, gzip, hashlib, json, os
          from pathlib import Path, PurePosixPath
          payload = gzip.decompress(base64.b64decode((Path(os.environ["RUNNER_TEMP"]) / "brad-log.bundle.b64").read_text()))
          assert hashlib.sha256(payload).hexdigest() == 'fb91fabfd2160aaf5df60e2f8377edaa8c93c14ef388f9aefcd748ae831b1960', "Source bundle checksum mismatch"
          files = json.loads(payload)
          root = Path.cwd().resolve()
          for item in files:
              path = PurePosixPath(item["path"])
              assert not path.is_absolute() and ".." not in path.parts
              assert path.parts[0] != ".git" and not str(path).startswith(".github/workflows/")
              target = root / str(path)
              assert target.resolve().is_relative_to(root)
              assert not target.is_symlink()
              for parent in target.parents:
                  if parent == root: break
                  assert not parent.is_symlink()
              resolved = target.resolve().relative_to(root)
              assert resolved.parts[0] != ".git" and resolved.parts[:2] != (".github", "workflows")
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(item["text"].encode("utf-8") if "text" in item else base64.b64decode(item["base64"]))
          print(f"Imported {len(files)} reviewed source files; Git history and workflow were preserved.")
      - name: Scan source and commit without a private email
        shell: bash
        run: |
          node scripts/check-public.mjs --source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'Source already matches the reviewed bundle.'
          else
            git commit -m 'feat: prepare free anonymous community and analytics'
            git push origin HEAD:main
          fi
