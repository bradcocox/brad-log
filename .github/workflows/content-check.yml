name: Validate Brad.log Content

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/content/**'
      - 'src/assets/**'
      - 'src/pages/**'
      - 'src/components/**'
      - 'src/styles/**'
      - 'src/content.config.ts'
      - '.github/workflows/content-check.yml'
  push:
    branches:
      - 'content/**'
    paths:
      - 'src/content/**'
      - 'src/assets/**'
      - 'src/pages/**'
      - 'src/components/**'
      - 'src/styles/**'
      - 'src/content.config.ts'
      - '.github/workflows/content-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    name: Content, safety, tests, Astro build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Security check, community tests, Astro check, build, search, engagement manifest
        run: pnpm run build
