<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 500" role="img" aria-labelledby="ttl desc"><title id="ttl">Modern Web Guidance 的對照評測流程</title><desc id="desc">同一組任務由未啟用指南和啟用指南的代理執行，再交由 Playwright 和程式規則檢查結果，最後比較通過率。</desc><defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans TC",sans-serif;fill:#193047}.main{font-size:29px;font-weight:700}.txt{font-size:22px;fill:#496578}.box{fill:#fff;stroke:#c2d4e3;stroke-width:2}.line{stroke:#4489ad;stroke-width:4;fill:none}</style><marker id="m" markerWidth="11" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4489ad"/></marker></defs><rect x="4" y="4" width="1152" height="492" rx="24" fill="#f2f7fb" stroke="#cfe0ea"/><text x="44" y="58" class="main">相同任務 × 相同測試條件</text><text x="44" y="93" class="txt">評估「產出的實作是否符合檢查條件」，不是單純比較 Agent 回覆速度。</text>
<rect x="42" y="165" width="228" height="150" rx="20" class="box"/><text x="63" y="213" class="main">任務集合</text><text x="63" y="251" class="txt">自然語言需求</text><text x="63" y="283" class="txt">不直接提示 API</text>
<path d="M274 240H330V170H385" class="line" marker-end="url(#m)"/><path d="M330 240V345H385" class="line" marker-end="url(#m)"/>
<rect x="392" y="120" width="292" height="125" rx="20" class="box"/><text x="414" y="171" class="main">Unguided</text><text x="414" y="209" class="txt">Agent 不取用指南</text>
<rect x="392" y="280" width="292" height="125" rx="20" class="box"/><text x="414" y="332" class="main">Guided</text><text x="414" y="370" class="txt">Agent 搜尋並取用指南</text>
<path d="M689 185H752V246H799" class="line" marker-end="url(#m)"/><path d="M689 345H752V270H799" class="line" marker-end="url(#m)"/>
<rect x="807" y="183" width="308" height="157" rx="20" class="box"/><text x="826" y="234" class="main">Playwright Grader</text><text x="826" y="272" class="txt">DOM / 行為 / 樣式</text><text x="826" y="307" class="txt">比較檢查通過率</text><text x="43" y="453" class="txt">圖為官方 Eval Pipeline 的概念重繪；實際得分請以相同日期、Agent 和題組的 Dashboard 為準。</text>
</svg>